<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — DompetKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=1.3">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>DompetKu</h1>
        <p>Pencatat Pengeluaran Harian</p>
      </div>

      <div id="alertBox" class="alert alert-danger" role="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-group" style="position: relative; display: flex; align-items: center; width: 100%;">
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password" style="padding-right: 48px; width: 100%;">
            <button type="button" class="btn-toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Tampilkan atau sembunyikan password" title="Tampilkan password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; outline: none; box-shadow: none; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; color: #64748b; z-index: 5;">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Masuk ke Akun</button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="/register.html">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      var pwd = document.getElementById('password');
      var btn = document.getElementById('togglePasswordBtn');
      if (!pwd || !btn) return;
      var isPassword = pwd.type === 'password';
      pwd.type = isPassword ? 'text' : 'password';
      btn.title = isPassword ? 'Sembunyikan password' : 'Tampilkan password';
      btn.innerHTML = isPassword
        ? '<svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>'
        : '<svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
  </script>
  <script src="/js/auth.js?v=1.3"></script>
</body>
</html>
