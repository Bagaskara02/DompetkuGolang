<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — DompetKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>DompetKu</h1>
        <p>Pencatat Pengeluaran Harian</p>
      </div>

      <div id="alertBox" class="alert alert-danger" role="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Masuk ke Akun</button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="/register.html">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
