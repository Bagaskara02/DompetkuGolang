<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — DompetKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>DompetKu</h1>
        <p>Buat Akun Baru</p>
      </div>

      <div id="alertBox" class="alert alert-danger" role="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Minimal 3 karakter" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" class="form-control" placeholder="contoh@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-group">
            <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required autocomplete="new-password">
            <button type="button" class="btn-toggle-password" id="togglePasswordBtn" aria-label="Tampilkan atau sembunyikan password" title="Tampilkan/Sembunyikan password">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Daftar Akun</button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun? <a href="/login.html">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
